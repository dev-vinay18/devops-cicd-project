services:
  web:
    image: ${IMAGE:-instantprachi/static-site}:${TAG:-latest}
    container_name: static-site
    ports:
      - "${HOST_PORT:-80}:80"
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # Optional: auto-updates the web container when a new image is pushed.
  # Only starts when the "autoupdate" profile is enabled.
  watchtower:
    image: containrrr/watchtower
    profiles: ["autoupdate"]
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 --label-enable --cleanup
    restart: unless-stopped
